<svg width="680" height="900" viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Unified architecture of the improved Retinex low-light video enhancement model</title>
<desc>Diagram showing a low-light frame processed by a VGG-19 shadow feature extractor and a noise input, feeding a deformable-convolution encoder-decoder that predicts reflectance and illumination. A separate affine motion network predicts a warp grid used for temporal propagation. Illumination is gamma-corrected and divided into the original frame to produce the enhanced output.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #2C2C2A; }
.th { font-size: 14px; font-weight: 700; }
.t { font-size: 14px; font-weight: 400; }
.ts { font-size: 12px; font-weight: 400; }
.box { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
.c-purple text { fill: #26215C; }
.c-purple .ts { fill: #3C3489; }
.c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal text { fill: #04342C; }
.c-teal .ts { fill: #085041; }
.c-coral rect { fill: #FAECE7; stroke: #993C1D; }
.c-coral text { fill: #4A1B0C; }
.c-coral .ts { fill: #712B13; }
.c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
.c-amber text { fill: #412402; }
.c-amber .ts { fill: #633806; }
.c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray text { fill: #2C2C2A; }
.c-gray .ts { fill: #444441; }
line.arr { stroke: #2C2C2A; stroke-width: 1.5; }
</style>
<rect x="0" y="0" width="680" height="900" fill="white"/>

<text class="th" x="40" y="30">Inputs</text>

<g class="c-gray">
<rect x="40" y="46" width="150" height="44" rx="8"/>
<text class="th" x="115" y="68" text-anchor="middle" dominant-baseline="central">Low-light frame</text>
</g>

<g class="c-gray">
<rect x="210" y="46" width="130" height="44" rx="8"/>
<text class="th" x="275" y="68" text-anchor="middle" dominant-baseline="central">Random noise</text>
</g>

<g class="c-purple">
<rect x="40" y="120" width="150" height="56" rx="8"/>
<text class="th" x="115" y="140" text-anchor="middle" dominant-baseline="central">VGG-19 block 1</text>
<text class="ts" x="115" y="158" text-anchor="middle" dominant-baseline="central">Shadow features (64ch)</text>
</g>

<line x1="115" y1="90" x2="115" y2="118" class="arr" marker-end="url(#arrow)"/>
<line x1="115" y1="90" x2="240" y2="240" class="arr" marker-end="url(#arrow)"/>
<line x1="275" y1="90" x2="275" y2="228" class="arr" marker-end="url(#arrow)"/>
<line x1="115" y1="176" x2="180" y2="228" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple">
<rect x="150" y="228" width="220" height="48" rx="8"/>
<text class="th" x="260" y="246" text-anchor="middle" dominant-baseline="central">Concat</text>
<text class="ts" x="260" y="262" text-anchor="middle" dominant-baseline="central">frame + VGG feat + noise to 75ch</text>
</g>

<line x1="260" y1="276" x2="260" y2="304" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="100" y="304" width="320" height="56" rx="8"/>
<text class="th" x="260" y="324" text-anchor="middle" dominant-baseline="central">Deformable conv encoder</text>
<text class="ts" x="260" y="342" text-anchor="middle" dominant-baseline="central">3 down-sampling stages, 32 to 256ch</text>
</g>

<line x1="260" y1="360" x2="260" y2="388" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="100" y="388" width="320" height="56" rx="8"/>
<text class="th" x="260" y="406" text-anchor="middle" dominant-baseline="central">Bottleneck + decoder</text>
<text class="ts" x="260" y="424" text-anchor="middle" dominant-baseline="central">Transpose-conv upsampling, skip concats</text>
</g>

<line x1="220" y1="444" x2="180" y2="480" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="444" x2="340" y2="480" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="60" y="480" width="180" height="44" rx="8"/>
<text class="th" x="150" y="502" text-anchor="middle" dominant-baseline="central">Reflectance (R)</text>
</g>

<g class="c-teal">
<rect x="260" y="480" width="180" height="44" rx="8"/>
<text class="th" x="350" y="502" text-anchor="middle" dominant-baseline="central">Illumination (I)</text>
</g>

<text class="th" x="500" y="30">Motion module</text>

<g class="c-coral">
<rect x="460" y="120" width="180" height="56" rx="8"/>
<text class="th" x="550" y="138" text-anchor="middle" dominant-baseline="central">Affine motion net</text>
<text class="ts" x="550" y="156" text-anchor="middle" dominant-baseline="central">CNN to 6 affine params</text>
</g>

<line x1="550" y1="90" x2="550" y2="118" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray">
<rect x="475" y="46" width="150" height="44" rx="8"/>
<text class="th" x="550" y="68" text-anchor="middle" dominant-baseline="central">Random affine transform</text>
</g>

<line x1="550" y1="176" x2="550" y2="204" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="460" y="204" width="180" height="56" rx="8"/>
<text class="th" x="550" y="222" text-anchor="middle" dominant-baseline="central">affine_grid</text>
<text class="ts" x="550" y="240" text-anchor="middle" dominant-baseline="central">params to sampling grid</text>
</g>

<line x1="550" y1="260" x2="550" y2="500" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="558" y="390">warp grid</text>

<g class="c-coral">
<rect x="460" y="500" width="180" height="56" rx="8"/>
<text class="th" x="550" y="518" text-anchor="middle" dominant-baseline="central">grid_sample warp</text>
<text class="ts" x="550" y="536" text-anchor="middle" dominant-baseline="central">applies to R and I</text>
</g>

<line x1="150" y1="524" x2="470" y2="524" class="arr" marker-end="url(#arrow)"/>
<line x1="350" y1="524" x2="470" y2="524" class="arr" marker-end="url(#arrow)"/>

<line x1="500" y1="556" x2="500" y2="590" class="arr" marker-end="url(#arrow)"/>
<line x1="600" y1="556" x2="600" y2="590" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="420" y="590" width="160" height="44" rx="8"/>
<text class="th" x="500" y="612" text-anchor="middle" dominant-baseline="central">Warped R</text>
</g>
<g class="c-teal">
<rect x="595" y="590" width="45" height="44" rx="8"/>
</g>
<text class="ts" x="617" y="612" text-anchor="middle" dominant-baseline="central">I</text>

<line x1="500" y1="634" x2="500" y2="662" class="arr" marker-end="url(#arrow)"/>

<g class="c-amber">
<rect x="420" y="662" width="160" height="56" rx="8"/>
<text class="th" x="500" y="680" text-anchor="middle" dominant-baseline="central">Gamma correction</text>
<text class="ts" x="500" y="698" text-anchor="middle" dominant-baseline="central">on illumination map</text>
</g>

<line x1="500" y1="718" x2="500" y2="746" class="arr" marker-end="url(#arrow)"/>
<line x1="115" y1="90" x2="380" y2="770" class="arr" marker-end="url(#arrow)"/>

<g class="c-amber">
<rect x="280" y="746" width="240" height="48" rx="8"/>
<text class="th" x="400" y="764" text-anchor="middle" dominant-baseline="central">Divide</text>
<text class="ts" x="400" y="780" text-anchor="middle" dominant-baseline="central">original frame / gamma-corrected I</text>
</g>

<line x1="400" y1="794" x2="400" y2="822" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="310" y="822" width="180" height="44" rx="8"/>
<text class="th" x="400" y="844" text-anchor="middle" dominant-baseline="central">Clamp [0, 1]</text>
</g>

<line x1="400" y1="866" x2="400" y2="874" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="400" y="885" text-anchor="middle">Enhanced frame</text>
</svg>
